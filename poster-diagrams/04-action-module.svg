<rect x="210" y="1240" width="580" height="100" rx="12" fill="#fff7ea" stroke="#b58a3c" stroke-width="1.5"/>
<text x="500.0" y="1273.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#183047">Keep searchable action history</text>
<text x="500.0" y="1308.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536577">Past actions and ratings inform future decisions</text>
