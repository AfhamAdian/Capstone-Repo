<text x="435.0" y="838.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536577">Use observed results to judge effectiveness</text>
<polyline points="500,725 500,765" fill="none" stroke="#718396" stroke-width="2" stroke-linejoin="round"/>
<polygon points="500,765 495.21537912477646,755.0950818741205 504.78462087522354,755.0950818741205" fill="#718396"/>
