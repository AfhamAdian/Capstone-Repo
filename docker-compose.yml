services:
  redis:
    image: redis:alpine
    container_name: capstone-redis
    ports:
      - "6379:6379"
    networks:
      - capstone-net
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capstone-api
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      - redis
    networks:
      - capstone-net
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capstone-worker
    command: node --import tsx apps/worker/src/worker.ts
    ports:
      - "4000:3000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      - redis
    networks:
      - capstone-net
    restart: always

networks:
  capstone-net:
    driver: bridge
